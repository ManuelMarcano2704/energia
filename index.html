<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Energía (BETA)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>Medidor de Energía <span class="etiqueta-beta">PRO</span></h1>
            <p>Calcula tu gasto eléctrico mensual en dólares (USD).</p>
        </header>

        <div class="seccion-configuracion">
            <label>Costo por kWh (USD):</label>
            <input type="number" id="precio-kwh" value="0.15" step="0.01">
        </div>

        <div class="seccion-formulario">
            <input type="text" id="nombre-aparato" placeholder="Nombre (Ej. Televisor)">
            <input type="number" id="watts" placeholder="Consumo en Watts (Ej. 100)">
            <input type="number" id="horas" placeholder="Horas de uso al día (Ej. 4)">
            <p id="error-msg" class="oculto">Por favor, llena todos los datos correctamente.</p>
            <button onclick="agregarAparato()">Agregar Aparato</button>
        </div>

        <div class="seccion-resultados">
            <h2>Gasto Mensual: $<span id="total-dolares">0.00</span> USD</h2>
            <p>Consumo total: <span id="total-kwh">0.0</span> kWh al mes</p>
        </div>

        <ul id="lista-aparatos"></ul>

        <div class="proximamente">
            <p>🚧 Próximamente: consejos de ahorro.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
